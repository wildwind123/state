name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Oldest supported runner: the binary then also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build

      # Every output is saved so a failure can be diagnosed from the artifact or the next step.
      - name: Smoke test
        run: |
          set -x
          export STATE_CACHE_DIR="$RUNNER_TEMP/cache"
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out"
          ./build/state --version
          ./build/state > "$out/overview.txt" 2>&1
          ./build/state --json > "$out/overview.json"
          python3 -m json.tool "$out/overview.json" > /dev/null
          ./build/state dirstat --scan /usr/share > "$out/scan.txt" 2>&1
          ./build/state dirstat --tree /usr/share/doc -d 1 -n 5 > "$out/tree.txt" 2>&1
          ./build/state -s 127.0.0.1:8084 > "$out/server.log" 2>&1 &
          server=$!
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8084/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8084/api/system -o "$out/system.json"
          python3 -m json.tool "$out/system.json" > /dev/null
          curl -fsS 'http://127.0.0.1:8084/api/dirstat?path=/usr/share&depth=1' -o "$out/dirstat.json"
          python3 -m json.tool "$out/dirstat.json" > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8084/dirstat
          kill "$server"

      - name: Show smoke test output
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/smoke/*; do echo "===== $f"; cat "$f"; echo; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-smoke-output
          path: ${{ runner.temp }}/smoke

      - name: Package
        run: |
          name=state-${{ steps.version.outputs.version }}-linux-x86_64
          mkdir "$name" && cp build/state README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: state-*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
            curl

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build

      - name: Smoke test
        run: |
          set -x
          export STATE_CACHE_DIR="$(cygpath -m "$RUNNER_TEMP")/cache"
          ./build/state.exe --version
          ./build/state.exe
          ./build/state.exe dirstat --scan 'C:/Windows/System32/drivers' -q
          ./build/state.exe dirstat --tree 'c:\windows\system32\drivers' -d 1 -n 5
          ./build/state.exe -s 127.0.0.1:8084 &
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8084/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8084/api/system
          curl -fsS 'http://127.0.0.1:8084/api/dirstat?path=C:/Windows/System32/drivers&depth=1' > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8084/dirstat
          kill %1 || taskkill //F //IM state.exe

      - name: Package
        run: |
          name=state-${{ steps.version.outputs.version }}-windows-x86_64
          mkdir "$name" && cp build/state.exe README.md LICENSE "$name/"
          zip -r "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: state-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum state-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v1.0.0-alpha.0, -beta, -rc.1) are marked as pre-releases.
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $pre \
            state-* SHA256SUMS.txt
