name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Oldest supported runner: the binary then also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build
          (cd build && cpack -G DEB)

      # Every output is saved; on failure the reason is posted as a (public) annotation.
      - name: Smoke test
        run: |
          set -x
          export STATE_CACHE_DIR="$RUNNER_TEMP/cache"
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out"
          # Is anything already listening on the default port on this runner?
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/ || true)
          echo "::notice title=port 8084 before start::HTTP status $code (000 = nothing listening)"
          # get URL FILE: fails with the response body when the status is not 200
          get() {
            code=$(curl -sS -o "$2" -w '%{http_code}' "$1") || code="no response"
            [ "$code" = 200 ] && return 0
            echo "::error title=$1 returned HTTP $code::$(head -c 1500 "$2" | tr '\n' ' ')"
            return 1
          }
          ./build/state --version
          ./build/state > "$out/overview.txt" 2>&1
          ./build/state --json > "$out/overview.json"
          python3 -m json.tool "$out/overview.json" > /dev/null
          ./build/state dirstat --scan /usr/share > "$out/scan.txt" 2>&1
          ./build/state dirstat --tree /usr/share/doc -d 1 -n 5 > "$out/tree.txt" 2>&1
          # A random high port: a fixed one may already be taken on the runner.
          port=$((20000 + RANDOM % 20000))
          base="http://127.0.0.1:$port"
          ./build/state -s "127.0.0.1:$port" > "$out/server.log" 2>&1 &
          server=$!
          for i in $(seq 30); do
            kill -0 "$server" 2>/dev/null || { echo "::error title=server exited::$(tr '\n' ' ' < "$out/server.log")"; exit 1; }
            curl -fs -o /dev/null "$base/" && break
            sleep 1
          done
          get "$base/api/system" "$out/system.json"
          python3 -m json.tool "$out/system.json" > /dev/null
          get "$base/api/dirstat?path=/usr/share&depth=1" "$out/dirstat.json"
          python3 -m json.tool "$out/dirstat.json" > /dev/null
          get "$base/dirstat" "$out/dirstat.html"
          kill "$server"

      - name: Show smoke test output
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/smoke/*.txt "$RUNNER_TEMP"/smoke/*.log; do
            echo "===== $f"; cat "$f"; echo
            # Annotations are visible without logging in; %0A keeps line breaks.
            body=$(head -c 3000 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=$(basename "$f")::$body"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-smoke-output
          path: ${{ runner.temp }}/smoke

      # Installs the .deb, runs the packaged systemd service (on a free port), then purges it.
      - name: Test .deb package
        run: |
          set -x
          sudo apt-get install -y ./build/state-*.deb
          dpkg -L state
          state --version
          test -f /usr/share/man/man1/state.1.gz
          port=$((20000 + RANDOM % 20000))
          base="http://127.0.0.1:$port"
          sudo mkdir -p /etc/systemd/system/state.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/state -s 127.0.0.1:%s\n' "$port" |
            sudo tee /etc/systemd/system/state.service.d/port.conf
          sudo systemctl daemon-reload
          sudo systemctl start state
          for i in $(seq 30); do curl -fs -o /dev/null "$base/" && break; sleep 1; done
          curl -fsS "$base/api/system" | python3 -m json.tool > /dev/null
          curl -fsS -X POST "$base/api/dirstat/scan?path=/usr/share/doc"
          for i in $(seq 30); do curl -fsS "$base/api/dirstat/status" | grep -q '"running":false' && break; sleep 1; done
          curl -fsS "$base/api/dirstat?path=/usr/share/doc&depth=1" | python3 -m json.tool > /dev/null
          sudo ls -la /var/cache/state/
          sudo rm -rf /etc/systemd/system/state.service.d
          sudo apt-get purge -y state
          if command -v state; then echo "::error::state is still installed after purge"; exit 1; fi
          [ ! -e /var/cache/private/state ]

      - name: Show service log
        if: failure()
        run: |
          sudo journalctl -u state --no-pager || true
          echo "::warning title=state.service log::$(sudo journalctl -u state --no-pager -n 40 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Package
        run: |
          name=state-${{ steps.version.outputs.version }}-linux-x86_64
          mkdir "$name" && cp build/state README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          cp build/state-*.deb .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            state-*.tar.gz
            state-*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
            curl

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build

      - name: Smoke test
        run: |
          set -x
          export STATE_CACHE_DIR="$(cygpath -m "$RUNNER_TEMP")/cache"
          ./build/state.exe --version
          ./build/state.exe
          ./build/state.exe dirstat --scan 'C:/Windows/System32/drivers' -q
          ./build/state.exe dirstat --tree 'c:\windows\system32\drivers' -d 1 -n 5
          port=$((20000 + RANDOM % 20000))
          base="http://127.0.0.1:$port"
          ./build/state.exe -s "127.0.0.1:$port" &
          server=$!
          for i in $(seq 30); do
            kill -0 "$server" 2>/dev/null || { echo "::error title=server exited::see log"; exit 1; }
            curl -fs -o /dev/null "$base/" && break
            sleep 1
          done
          curl -fsS "$base/api/system"
          curl -fsS "$base/api/dirstat?path=C:/Windows/System32/drivers&depth=1" > /dev/null
          curl -fsS -o /dev/null "$base/dirstat"
          kill "$server" || taskkill //F //IM state.exe

      - name: Package
        run: |
          name=state-${{ steps.version.outputs.version }}-windows-x86_64
          mkdir "$name" && cp build/state.exe README.md LICENSE "$name/"
          zip -r "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: state-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum state-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v1.0.0-alpha.0, -beta, -rc.1) are marked as pre-releases.
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $pre \
            state-* SHA256SUMS.txt
